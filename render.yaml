# Render blueprint: FastAPI backend + React static frontend.
# DATABASE_URL must be set manually in Render dashboard (Neon connection string).
services:
  - type: web
    name: performanceassistant-api
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        sync: false

  - type: web
    name: performanceassistant-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
