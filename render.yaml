# Render blueprint: web service + free Postgres.
# Push this repo, "New +" -> "Blueprint", point at the repo.
services:
  - type: web
    name: perfreviewbot
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false            # set in dashboard, not committed
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        fromDatabase:
          name: perfreviewbot-db
          property: connectionString

databases:
  - name: perfreviewbot-db
    plan: free
