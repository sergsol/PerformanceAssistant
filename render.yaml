# Render blueprint: web service only.
# Database is hosted on Neon (free, no expiry) — set DATABASE_URL manually in the dashboard.
# Deploy: New + → Blueprint → connect repo → set GEMINI_API_KEY and DATABASE_URL in env vars.
services:
  - type: web
    name: perfreviewbot
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false            # paste your key in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        sync: false            # paste your Neon connection string in the Render dashboard
