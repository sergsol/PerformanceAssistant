senior_qa:
  role: "Senior QA Engineer"
  level: "Senior"
  # The core encoded judgment: Dimension 1 maxed out ALONE caps overall at
  # Meets-trending-Below. Execution is necessary but not sufficient for Senior.
  dimensions:
    - name: "Technical execution & automation"
      below: "Flaky/shallow tests; relies on others for framework issues; limited automation."
      meets: "Reliable automated UI/API tests; fluent in the framework; clear bug reports. Ceiling for execution-only work."
      exceeds: "Improves the framework itself; introduces patterns others adopt; raises the automation bar."
    - name: "Test strategy & quality ownership"
      below: "Follows plans written by others; reactive; no strategy input."
      meets: "Owns test strategy for a feature/service; risk-based coverage; begins shift-left prevention."
      exceeds: "Owns strategy across services/teams; drives prevention culture; introduces new practices (incl. AI-assisted testing) that measurably improve outcomes."
    - name: "Autonomy & scope"
      below: "Needs well-defined tasks and regular direction."
      meets: "Self-directed on ambiguous quality problems in their area; defines own approach."
      exceeds: "Sets direction on org-level ambiguous problems; others take direction from them."
    - name: "Influence & collaboration"
      below: "Communicates within own tasks; little cross-team interaction."
      meets: "Collaborates with dev/PM; presents quality metrics to stakeholders; influences peers."
      exceeds: "Shifts how the team/org thinks about quality; trusted cross-team advocate; influences roadmap/process."
    - name: "Mentorship"
      below: "Focused only on own work."
      meets: "Mentors juniors; reviews others' tests; shares knowledge."
      exceeds: "Formally grows multiple engineers; raises team capability; creates standards/resources."
    - name: "Business & risk impact"
      below: "Reports issues without business context."
      meets: "Frames quality in business/risk terms; prioritizes by risk."
      exceeds: "Quantifies quality's business impact; drives risk-based decisions that change what the org ships."
  aggregation:
    exceeds: "Exceeds in >=3 dimensions incl. at least one of {strategy, influence, business}; no dimension Below."
    meets: "Meets or better in >=4 dimensions incl. Test strategy & quality ownership."
    below: "Test strategy is Below, OR >=3 dimensions Below."
    meets_trending_below: "Execution Meets/Exceeds but strategy/influence/mentorship mostly empty."

trainee_qa:
  role: "Trainee QA Engineer"
  level: "Trainee"
  dimensions:
    - name: "Technical execution & automation"
      below: "Struggles to execute assigned test cases without frequent correction; does not engage with tooling or documentation."
      meets: "Executes manual test cases under guidance with acceptable accuracy; begins learning the team's automation toolchain."
      exceeds: "Proactively explores automation basics beyond what is assigned and produces reusable test artifacts earlier than expected."
    - name: "Test strategy & quality ownership"
      below: "Does not follow the test plan provided or misses obvious defect categories even when guided."
      meets: "Follows defined test plans reliably and escalates unclear requirements to their mentor before proceeding."
      exceeds: "Asks clarifying questions that reveal gaps in test coverage, showing early quality-ownership instincts."
    - name: "Autonomy & scope"
      below: "Requires constant hand-holding; blocks progress without proactively seeking help."
      meets: "Completes clearly scoped tasks independently after initial guidance and asks for help at appropriate intervals."
      exceeds: "Completes assigned tasks with minimal check-ins and begins identifying adjacent tasks without prompting."
    - name: "Influence & collaboration"
      below: "Does not communicate blockers or findings clearly; isolates rather than collaborating."
      meets: "Communicates status and defects clearly within the immediate team; participates constructively in rituals."
      exceeds: "Contributes observations in team discussions that add value beyond their assigned scope."
    - name: "Mentorship"
      below: "Does not absorb feedback or apply corrections across similar situations."
      meets: "Receives and applies feedback consistently; shows visible improvement sprint over sprint."
      exceeds: "Actively seeks feedback, documents personal learnings, and shares knowledge artifacts with peers."
    - name: "Business & risk impact"
      below: "Misses high-severity defects or repeatedly files low-quality bug reports requiring significant rework."
      meets: "Files clear, reproducible bug reports; correctly applies severity labels with guidance."
      exceeds: "Identifies defects with potential user-facing impact and articulates the risk clearly without prompting."
  aggregation:
    exceeds: "Consistently meets all expectations and demonstrates at least two dimensions at Exceeds; learns faster than the standard ramp timeline."
    meets: "Reliably completes guided tasks accurately, communicates well, and shows steady growth across all dimensions."
    below: "Requires correction on repeated errors, misses expectations in two or more dimensions, or is not progressing at an acceptable learning pace."
    meets_trending_below: "Currently meeting expectations but showing a slowdown in growth rate or accumulating recurring feedback on the same dimension."

junior_qa:
  role: "Junior QA Engineer"
  level: "Junior"
  dimensions:
    - name: "Technical execution & automation"
      below: "Produces test cases with significant gaps; automation contributions require substantial rework."
      meets: "Independently writes thorough manual test cases and contributes basic automated checks within established frameworks."
      exceeds: "Extends automation coverage beyond assigned scope and improves existing test reliability without being asked."
    - name: "Test strategy & quality ownership"
      below: "Relies entirely on others for test scope decisions; does not surface coverage gaps."
      meets: "Owns testing for assigned features using team-defined strategies; flags missing acceptance criteria proactively."
      exceeds: "Proposes improvements to the team's test approach for their feature area and validates proposals with data."
    - name: "Autonomy & scope"
      below: "Requires ongoing direction to complete standard feature testing; blocks on decisions within their scope."
      meets: "Executes independently on well-defined feature testing tasks and resolves routine ambiguity without escalation."
      exceeds: "Picks up adjacent testing work opportunistically and self-manages priority trade-offs with minimal guidance."
    - name: "Influence & collaboration"
      below: "Communicates findings inconsistently; misses handoffs or creates friction in team workflows."
      meets: "Collaborates effectively with developers and product within the immediate team; gives and receives feedback constructively."
      exceeds: "Proactively surfaces quality concerns to developers early in the cycle, preventing defects rather than just finding them."
    - name: "Mentorship"
      below: "Does not incorporate feedback from retrospectives or 1:1s into day-to-day work."
      meets: "Integrates feedback consistently and begins sharing knowledge informally with trainees when opportunities arise."
      exceeds: "Actively supports trainee onboarding and produces documentation or guides that benefit the broader team."
    - name: "Business & risk impact"
      below: "Misses release-blocking defects or files reports that slow triage due to poor quality."
      meets: "Catches functional defects with appropriate severity ratings; release sign-offs are reliable within their feature scope."
      exceeds: "Identifies edge cases with real user-impact potential that would not have been caught by standard test plans."
  aggregation:
    exceeds: "Consistently meets all dimensions and exceeds in at least two; demonstrably raises quality bar beyond assigned scope."
    meets: "Independently owns feature-level testing with reliable output, clear communication, and steady skill growth."
    below: "Frequently requires guidance on tasks within expected scope, or produces work requiring significant rework in two or more dimensions."
    meets_trending_below: "Currently meeting expectations but receiving repeated feedback on the same gaps or showing limited growth over two or more cycles."

mid_qa:
  role: "Mid QA Engineer"
  level: "Mid"
  dimensions:
    - name: "Technical execution & automation"
      below: "Automation output is inconsistent in quality or maintainability; does not drive measurable improvement in test suite health."
      meets: "Designs and maintains robust automated test suites for their domain; improves pipeline reliability and coverage metrics consistently."
      exceeds: "Introduces tooling, patterns, or frameworks that uplift automation quality across the broader team."
    - name: "Test strategy & quality ownership"
      below: "Operates reactively; does not contribute to or challenge the team's test strategy."
      meets: "Owns end-to-end quality for one or more feature areas; contributes meaningfully to test strategy discussions and risk assessment."
      exceeds: "Drives quality strategy for their domain proactively, including non-functional concerns (performance, security, accessibility)."
    - name: "Autonomy & scope"
      below: "Requires direction on scope decisions within their ownership; escalates too frequently."
      meets: "Operates autonomously across their feature domain, makes sound trade-off decisions, and escalates only genuinely cross-team issues."
      exceeds: "Identifies and takes ownership of quality gaps outside their immediate domain without being assigned."
    - name: "Influence & collaboration"
      below: "Quality concerns are raised late or communicated in ways that create friction with development or product teams."
      meets: "Collaborates effectively across teams; advocates for quality early in the development process; trusted voice in planning."
      exceeds: "Shifts team culture toward quality-first thinking; cross-functional partners seek their input before starting significant work."
    - name: "Mentorship"
      below: "Does not invest in the growth of trainees or juniors on the team."
      meets: "Actively mentors trainees and junior engineers through pairing, reviews, and structured feedback; contributes to team knowledge base."
      exceeds: "Runs learning initiatives (workshops, guides, onboarding improvements) that measurably accelerate growth of multiple junior engineers."
    - name: "Business & risk impact"
      below: "Quality issues in their domain reach production at a rate above team baseline; risk assessments lack depth."
      meets: "Release decisions in their domain are informed by thorough risk analysis; production defect rate is at or below team baseline."
      exceeds: "Quality investments in their domain produce measurable reductions in production incidents or customer-reported issues."
  aggregation:
    exceeds: "Exceeds in at least three dimensions with clear cross-team impact; recognized as a quality authority within their domain."
    meets: "Independently owns feature-level quality end-to-end, collaborates cross-functionally, and actively grows junior engineers."
    below: "Falls short in two or more dimensions or requires significant senior oversight on work that should be self-directed."
    meets_trending_below: "Meeting current expectations but not yet contributing to strategy or mentorship in a consistent, meaningful way."

staff_qa:
  role: "Staff QA Engineer"
  level: "Staff"
  dimensions:
    - name: "Technical execution & automation"
      below: "Technical contributions are scoped to a single team; does not establish standards adopted beyond their immediate work."
      meets: "Sets technical standards and automation patterns adopted across multiple teams; resolves systemic gaps in test infrastructure."
      exceeds: "Architects quality tooling or frameworks that become foundational across the engineering organization."
    - name: "Test strategy & quality ownership"
      below: "Strategy contributions are reactive or limited to a single team's scope."
      meets: "Defines and drives quality strategy at the org level; aligns quality goals with engineering and product roadmaps across teams."
      exceeds: "Shapes quality philosophy for the organization; creates self-sustaining quality practices that outlast direct involvement."
    - name: "Autonomy & scope"
      below: "Scoped to a single team's needs; does not self-identify and resolve cross-org quality issues."
      meets: "Independently identifies and drives resolution of quality problems that span multiple teams or systems."
      exceeds: "Anticipates org-level quality risks before they materialize and mobilizes resources proactively."
    - name: "Influence & collaboration"
      below: "Influence is limited to immediate team; not yet a sought-after voice in org-level technical or process decisions."
      meets: "Trusted technical authority across engineering; shapes processes, standards, and decisions at the department level."
      exceeds: "Partners at the VP/Director level to define quality direction; decisions they champion become org-wide policy."
    - name: "Mentorship"
      below: "Mentorship is informal or inconsistent; senior engineers on other teams do not grow as a result."
      meets: "Systematically develops senior and mid engineers across teams through sponsorship, structured mentorship, and leveling guidance."
      exceeds: "Creates org-wide programs or standards for QA career development; measurably increases the density of senior talent in the org."
    - name: "Business & risk impact"
      below: "Quality impact is not visible at the business or leadership level."
      meets: "Quality investments are tied to measurable business outcomes (incident reduction, release velocity, customer satisfaction)."
      exceeds: "Drives quality initiatives that materially improve key business metrics at a level visible to executive leadership."
  aggregation:
    exceeds: "Exceeds in four or more dimensions with documented org-wide impact; peers and leadership cite them as a force multiplier."
    meets: "Drives org-level quality strategy, grows senior engineers, and is a trusted cross-functional technical authority."
    below: "Impact remains team-scoped or requires senior direction on problems that should be self-identified and driven."
    meets_trending_below: "Meeting expectations but not yet operating with the strategic scope or influence expected at this level consistently."

principal_qa:
  role: "Principal QA Engineer"
  level: "Principal"
  dimensions:
    - name: "Technical execution & automation"
      below: "Technical influence does not extend beyond the organization; not viewed as an industry-level authority on quality engineering."
      meets: "Defines quality engineering practices adopted company-wide; recognized externally through publications, talks, or open-source contributions."
      exceeds: "Technical contributions become reference implementations cited by the broader industry; advances the state of the art in quality engineering."
    - name: "Test strategy & quality ownership"
      below: "Quality philosophy is reactive or internally focused; does not shape multi-year company strategy."
      meets: "Owns the company's quality philosophy and multi-year strategy; connects quality direction to long-term business and product vision."
      exceeds: "Creates a quality strategy that becomes a competitive differentiator; recognized by customers, peers, or analysts as industry-leading."
    - name: "Autonomy & scope"
      below: "Initiative is company-scoped; does not identify or respond to industry trends that should shape internal direction."
      meets: "Self-directs work with company-wide scope; identifies emerging risks from industry signals before they become internal problems."
      exceeds: "Shapes the company's position in the industry through proactive investments that preempt shifts in quality standards."
    - name: "Influence & collaboration"
      below: "Influence is primarily internal; does not shape external perception or industry thinking."
      meets: "Influences quality thinking across the company and externally through community engagement, standards bodies, or public-facing work."
      exceeds: "Widely regarded as a thought leader in quality engineering; external influence shapes how peers at other companies approach quality."
    - name: "Mentorship"
      below: "Mentorship is individual-focused; does not build a self-sustaining pipeline of quality leadership."
      meets: "Develops staff and principal-track engineers across the organization; creates mentorship structures that scale beyond direct involvement."
      exceeds: "Has produced multiple staff-level or above engineers who independently drive quality strategy; mentorship legacy is measurable."
    - name: "Business & risk impact"
      below: "Quality work is not connected to company-level outcomes or executive strategy."
      meets: "Quality investments are tied to company-level KPIs; executive leadership relies on their judgment for high-stakes quality decisions."
      exceeds: "Quality initiatives directly contribute to revenue, market position, or risk avoidance at a scale visible in company-level results."
  aggregation:
    exceeds: "Exceeds in four or more dimensions with verifiable external and company-level impact; regarded as a defining voice in quality engineering."
    meets: "Shapes company-wide quality philosophy, develops the next generation of quality leaders, and is a trusted advisor at the executive level."
    below: "Impact is org-scoped rather than company or industry-scoped, or requires direction on problems that should be self-generated."
    meets_trending_below: "Meeting current expectations but not yet demonstrating the external influence or multi-year strategic vision required at Principal level."

# ── Product Owner scorecards ─────────────────────────────────────────────────

associate_po:
  role: "Associate Product Owner"
  level: "Associate"
  dimensions:
    - name: "Product discovery & requirements"
      below: "Does not contribute meaningfully to discovery; requirements documents need significant rework."
      meets: "Participates in research sessions; documents requirements clearly under guidance; asks the right clarifying questions."
      exceeds: "Surfaces user insights unprompted and proposes requirement clarifications that improve feature quality before development starts."
    - name: "Backlog management & prioritization"
      below: "Backlog is disorganized or acceptance criteria are routinely unclear."
      meets: "Maintains a groomed backlog with clear user stories under supervision; escalates prioritization conflicts appropriately."
      exceeds: "Proactively grooms backlog items ahead of sprint planning and flags blockers or dependencies before they become issues."
    - name: "Stakeholder alignment & communication"
      below: "Does not communicate sprint status or changes; stakeholders are surprised by outcomes."
      meets: "Provides reliable status updates to immediate team; attends and contributes to stakeholder meetings with guidance."
      exceeds: "Anticipates stakeholder questions and prepares clear communication artifacts (status updates, release notes) without being asked."
    - name: "Delivery & execution oversight"
      below: "Blockers go unresolved; sprint commitments slip without early escalation."
      meets: "Tracks sprint progress against commitments; escalates blockers promptly; participates in sprint retrospectives constructively."
      exceeds: "Identifies delivery risk early and proposes scope adjustments that protect sprint commitments."
    - name: "Data-driven decision making"
      below: "Does not reference data when making or supporting product decisions."
      meets: "Pulls basic metrics from dashboards and references them in team discussions with guidance."
      exceeds: "Proactively monitors key metrics and brings data-backed observations to planning discussions without prompting."
    - name: "Strategic vision & roadmap"
      below: "Is unaware of or disconnected from the team's quarterly roadmap and goals."
      meets: "Understands the team roadmap and company OKRs; can explain the 'why' behind their feature area."
      exceeds: "Connects daily work to strategic goals and surfaces ideas for the roadmap that are grounded in user needs."
  aggregation:
    exceeds: "Exceeds in at least two dimensions; demonstrates initiative beyond the expected scope for their level."
    meets: "Reliably executes on assigned backlog work, communicates clearly, and shows steady growth toward independent ownership."
    below: "Requires significant guidance on tasks within expected scope or produces work that blocks team progress."
    meets_trending_below: "Meeting expectations but not growing toward independent ownership at the pace expected at this level."

po:
  role: "Product Owner"
  level: "Product Owner"
  # Calibrated for enterprise/B2B POs who own strategy, architect collaboration,
  # customer-facing roadmap, and junior PO support — not just backlog management.
  dimensions:
    - name: "Product discovery & requirements"
      below: "Requirements are frequently incomplete or change mid-sprint; does not involve architects or technical leads in solutioning."
      meets: "Runs discovery for their domain and involves architects in solutioning when needed; requirements are clear enough that development starts without major rework."
      exceeds: "Discovery proactively surfaces needs beyond the original scope; architect collaboration produces solutions that are reused or adopted beyond the immediate feature."
    - name: "Backlog management & prioritization"
      below: "Backlog is not well-prioritized or is disconnected from any longer-term plan."
      meets: "Owns and prioritizes the backlog with clear rationale; contributes to and maintains a year-level roadmap that reflects both near-term delivery and longer-term direction."
      exceeds: "Roadmap is actively used as a strategic tool — regularly updated based on customer and business signals, not just an internal artifact."
    - name: "Stakeholder alignment & communication"
      below: "Internal or external meetings are poorly prepared; stakeholders are caught off guard by status or changes."
      meets: "Leads internal product meetings and participates in external customer meetings; communicates roadmap and priorities clearly; keeps program leadership informed of progress."
      exceeds: "Stakeholders proactively bring the PO into decisions because of consistent, reliable communication; no surprises at sprint review or customer calls."
    - name: "Delivery & execution oversight"
      below: "Sprint commitments slip repeatedly without early escalation; gives little or no support to junior POs."
      meets: "Keeps delivery on track and escalates blockers early; provides guidance to junior POs on feature breakdown, acceptance criteria, or prioritization when needed."
      exceeds: "Junior POs grow measurably more independent as a result of the support; delivery improvements are visible across more than one sprint."
    - name: "Data-driven decision making"
      below: "Decisions are made without reference to data or defined success metrics."
      meets: "Defines success metrics before features launch; uses available data and tooling — including AI tools where relevant — to inform requirements and validate decisions."
      exceeds: "Data and AI usage produces a visible improvement in decision quality or speed that the team can point to."
    - name: "Strategic vision & roadmap"
      below: "Work is purely reactive or short-term; no ownership of or contribution to longer-term direction."
      meets: "Works on both short-term priorities and longer-term strategy; year-level roadmap exists, is maintained, and is shared with customers and leadership — not just kept internally."
      exceeds: "Roadmap presentations actively shape customer expectations or influence how leadership prioritizes investment."
  aggregation:
    exceeds: "Exceeds in at least three dimensions with clear evidence of impact beyond task execution — customer trust, junior PO growth, or strategic influence."
    meets: "Owns the backlog and year-level roadmap, leads product meetings, keeps stakeholders aligned, supports junior POs, and uses data to inform decisions."
    below: "Two or more dimensions are consistently poor — backlog is unclear, stakeholders are surprised, or delivery is unreliable."
    meets_trending_below: "Delivering on immediate tasks but not yet taking ownership of strategy, customer communication, or junior PO development."

senior_po:
  role: "Senior Product Owner"
  level: "Senior"
  dimensions:
    - name: "Product discovery & requirements"
      below: "Discovery is limited to a single feature area; does not contribute to or influence research strategy."
      meets: "Drives discovery across multiple feature areas; shapes the research approach for their domain and ensures requirements are consistently high quality."
      exceeds: "Builds discovery systems (customer panels, feedback loops) that generate continuous insight across the team."
    - name: "Backlog management & prioritization"
      below: "Struggles to prioritize effectively across competing demands from multiple teams or stakeholders."
      meets: "Prioritizes effectively across a complex, multi-stakeholder domain; resolves conflicts with clear, data-backed reasoning."
      exceeds: "Introduces prioritization frameworks (e.g., RICE, cost of delay) that improve decision quality across the PO team."
    - name: "Stakeholder alignment & communication"
      below: "Senior stakeholder relationships are managed reactively; does not yet influence decisions at the leadership level."
      meets: "Navigates complex stakeholder dynamics; regularly influences senior leadership through well-reasoned product recommendations."
      exceeds: "Is the trusted product voice in leadership discussions; shapes cross-functional strategy through stakeholder alignment."
    - name: "Delivery & execution oversight"
      below: "Cross-team dependencies are not proactively managed; delivery risk is identified late."
      meets: "Coordinates cross-team delivery for their domain; manages dependencies and communicates delivery risk early."
      exceeds: "Designs delivery processes that reduce cross-team friction; measurably improves the team's predictability."
    - name: "Data-driven decision making"
      below: "Does not yet define or own KPIs at the domain level; data usage is tactical."
      meets: "Defines and owns KPIs for their product domain; connects product data to business outcomes in leadership forums."
      exceeds: "Drives a data culture on the team; introduces measurement practices adopted by other POs."
    - name: "Strategic vision & roadmap"
      below: "Roadmap is feature-list driven; not explicitly tied to multi-quarter business strategy."
      meets: "Owns the product area roadmap; aligns it with company OKRs and revisits it as business context evolves."
      exceeds: "Roadmap is a strategic differentiator; the team consistently ships work that moves company-level metrics."
  aggregation:
    exceeds: "Exceeds in at least three dimensions with documented impact on company-level metrics or cross-team processes."
    meets: "Independently owns a complex product domain, influences senior stakeholders, and drives measurable outcomes."
    below: "Delivery is unreliable or stakeholder relationships are poorly managed in two or more dimensions."
    meets_trending_below: "Delivering on current scope but not yet demonstrating the cross-team leadership or strategic ownership expected at Senior PO."

lead_po:
  role: "Lead Product Owner"
  level: "Lead"
  dimensions:
    - name: "Product discovery & requirements"
      below: "Discovery methodology is ad hoc; no systematic approach for gathering or validating customer insight at scale."
      meets: "Sets discovery methodology for the team; builds customer feedback systems that generate continuous, actionable insight."
      exceeds: "Discovery systems they built become org-wide standard; discovery output measurably improves product-market fit metrics."
    - name: "Backlog management & prioritization"
      below: "Does not effectively oversee multiple POs' backlogs; cross-product conflicts are unresolved."
      meets: "Oversees multiple POs' backlogs; resolves cross-product conflicts with clear, org-aligned reasoning."
      exceeds: "Introduces portfolio-level prioritization frameworks that are adopted company-wide."
    - name: "Stakeholder alignment & communication"
      below: "C-suite relationships are not established; product does not have a seat at key executive discussions."
      meets: "Manages C-suite relationships; represents product in executive forums; handles escalations with credibility."
      exceeds: "Is a trusted C-suite advisor on product strategy; their input shapes company-level decisions beyond the product org."
    - name: "Delivery & execution oversight"
      below: "Org-level delivery commitments are missed without adequate early warning or course correction."
      meets: "Accountable for org-level delivery commitments; identifies systemic delivery risks and drives structural fixes."
      exceeds: "Delivery processes they design measurably improve reliability across the org; other leaders adopt their frameworks."
    - name: "Data-driven decision making"
      below: "Org-wide product metrics are not defined or owned; data is used tactically rather than strategically."
      meets: "Defines org-wide product metrics; connects product data to business outcomes in exec-level reporting."
      exceeds: "Builds a data culture across the product organization; product metrics are cited at board-level discussions."
    - name: "Strategic vision & roadmap"
      below: "Multi-year vision is absent or not clearly connected to company strategy."
      meets: "Owns multi-year product vision for a domain; shapes company strategy through product roadmap leadership."
      exceeds: "Product vision they set becomes a competitive differentiator recognized by customers, analysts, or the market."
  aggregation:
    exceeds: "Exceeds in four or more dimensions; recognized by C-suite as a strategic product leader; cross-org impact is measurable."
    meets: "Accountable for org-level product outcomes; manages multiple POs effectively; trusted in exec-level product strategy discussions."
    below: "Org-level delivery or stakeholder management is failing, or the product org lacks strategic direction in two or more cycles."
    meets_trending_below: "Managing day-to-day org responsibilities but not yet demonstrating the multi-year strategic vision expected at Lead PO."

principal_po:
  role: "Principal Product Owner"
  level: "Principal"
  dimensions:
    - name: "Product discovery & requirements"
      below: "Discovery philosophy is internally focused; does not engage with market signals or shape how the org discovers."
      meets: "Defines market strategy; identifies new opportunity spaces through external signals; discovery philosophy shapes the entire product org."
      exceeds: "Discovery frameworks they create become industry reference; they are sought out externally to advise on product discovery practice."
    - name: "Backlog management & prioritization"
      below: "Still operating at a portfolio level; not yet shaping how prioritization is done across the company."
      meets: "Sets prioritization frameworks used company-wide; not engaged in tactical backlog management but ensures others have the tools to succeed."
      exceeds: "Prioritization philosophy they define is adopted externally; they contribute to industry thinking on product portfolio management."
    - name: "Stakeholder alignment & communication"
      below: "External stakeholder influence (customers, partners, industry) is limited."
      meets: "Represents the company's product vision externally to major customers, partners, and industry forums."
      exceeds: "Company's external product reputation is measurably shaped by their presence; they are a sought-after voice in the industry."
    - name: "Delivery & execution oversight"
      below: "Not yet accountable for company-level product outcomes; still operating at org/domain level."
      meets: "Accountable for company-level product outcomes; sets delivery standards that span the entire product organization."
      exceeds: "Delivery accountability at company level is paired with measurable improvements in outcomes (growth, retention, market share)."
    - name: "Data-driven decision making"
      below: "Data strategy is org-level; does not shape how the company uses data for product decisions at the board level."
      meets: "Shapes company data strategy through the product lens; product metrics defined at this level inform board-level discussions."
      exceeds: "Data culture they champion becomes a company-wide competitive advantage recognized externally."
    - name: "Strategic vision & roadmap"
      below: "Vision is company-scoped; does not influence industry direction or create new market categories."
      meets: "Co-creates company strategy; defines where the company competes; roadmap at this level shapes investor and market narratives."
      exceeds: "Vision they champion creates or defines a new market category; company is recognized as an industry leader in that space."
  aggregation:
    exceeds: "Exceeds in four or more dimensions with external, market-level impact; company's competitive position is measurably shaped by their work."
    meets: "Co-creates company strategy, shapes product culture company-wide, and is a trusted external voice for the company's product vision."
    below: "Operating at org scope rather than company or industry scope; direction-setting requires board-level input rather than self-generated."
    meets_trending_below: "Meeting exec-level expectations but not yet demonstrating the external influence or market-shaping vision expected at Principal PO."

# ── Developer scorecards ──────────────────────────────────────────────────────

trainee_dev:
  role: "Trainee Developer"
  level: "Trainee"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Writes code that frequently fails review for correctness or does not follow established patterns without guidance."
      meets: "Writes code that follows team patterns and passes review with minor feedback; learning the stack at an acceptable pace."
      exceeds: "Delivers working, clean code with minimal revision feedback and begins identifying small improvements in their area."
    - name: "System design & architecture"
      below: "Does not yet understand the system they are working in well enough to implement assigned tasks without blocking."
      meets: "Implements designs provided by others; asks good questions to understand context and constraints."
      exceeds: "Understands system context beyond their immediate task; begins making locally sound design decisions independently."
    - name: "Testing & quality mindset"
      below: "Does not write tests for own code or submits PRs without understanding test requirements."
      meets: "Writes basic unit tests for assigned code with guidance; understands why testing matters."
      exceeds: "Proactively adds tests beyond what is required and asks about edge cases during implementation."
    - name: "Collaboration & communication"
      below: "Blocks on tasks without communicating; does not surface uncertainty to the team."
      meets: "Communicates blockers clearly and promptly; participates in standups; asks good questions in code review."
      exceeds: "Contributes constructive observations in team discussions; helps others understand blockers they share."
    - name: "Mentorship & knowledge sharing"
      below: "Does not apply feedback from code reviews or 1:1s consistently."
      meets: "Receives and applies feedback consistently; shows visible improvement cycle over cycle."
      exceeds: "Actively documents learnings and shares them with other trainees; reduces repeat questions to mentors."
    - name: "Business & product impact"
      below: "Is unaware of the product context for the code they are writing."
      meets: "Understands the feature purpose and user-facing impact of assigned tasks."
      exceeds: "Connects implementation decisions to user outcomes; raises questions when something feels at odds with the product goal."
  aggregation:
    exceeds: "Exceeds in at least two dimensions; learning pace is visibly ahead of the standard ramp for their cohort."
    meets: "Completes guided implementation tasks correctly, communicates well, and shows steady growth across all dimensions."
    below: "Requires correction on repeated patterns, or progress is significantly below expected ramp pace in two or more dimensions."
    meets_trending_below: "Currently meeting expectations but growth rate is slowing or the same feedback recurs across multiple reviews."

junior_dev:
  role: "Junior Developer"
  level: "Junior"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Code frequently requires significant rework; does not yet write correct code independently for well-defined tasks."
      meets: "Independently delivers correct, readable code for well-defined tasks; code review feedback is minor and non-recurring."
      exceeds: "Delivers well-structured code that others use as a reference; proactively improves clarity or test coverage beyond what was asked."
    - name: "System design & architecture"
      below: "Does not participate meaningfully in design discussions; implementation does not consider system-level constraints."
      meets: "Implements straightforward designs; participates in design discussions and asks clarifying questions that improve the outcome."
      exceeds: "Proposes design options for their feature area and evaluates trade-offs with support from senior engineers."
    - name: "Testing & quality mindset"
      below: "Unit tests are missing or inadequate; PRs frequently lack coverage for obvious edge cases."
      meets: "Writes unit and integration tests for own code; understands the test pyramid and applies it consistently."
      exceeds: "Proactively improves test coverage beyond their feature scope; identifies gaps in the existing suite."
    - name: "Collaboration & communication"
      below: "Communicates inconsistently; does not actively participate in team processes."
      meets: "Actively participates in team rituals; communicates progress and blockers clearly; gives constructive code review feedback."
      exceeds: "Improves team communication by documenting decisions, writing clear PR descriptions, and contributing to team knowledge."
    - name: "Mentorship & knowledge sharing"
      below: "Does not share learnings or support onboarding of newer engineers."
      meets: "Shares learnings informally; begins supporting trainee onboarding; writes useful PR descriptions that help reviewers."
      exceeds: "Produces documentation or guides that reduce onboarding time; proactively supports trainees beyond what is asked."
    - name: "Business & product impact"
      below: "Implements tasks without understanding or questioning the product context."
      meets: "Understands the feature purpose and business context; can explain what they are building and why."
      exceeds: "Proactively surfaces edge cases or user experience issues that improve product quality beyond the original spec."
  aggregation:
    exceeds: "Exceeds in at least two dimensions; demonstrably raises the quality bar for their immediate team."
    meets: "Independently delivers correct, tested code for well-defined tasks; communicates well and shows consistent growth."
    below: "Code quality or testing is poor in two or more cycles, or communication is a recurring blocker for the team."
    meets_trending_below: "Delivering on assigned work but not yet growing toward broader ownership or influence at the expected pace."

mid_dev:
  role: "Mid Developer"
  level: "Mid"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Implementation contains recurring quality issues or technical debt that requires senior intervention."
      meets: "Delivers well-designed, tested code across a feature scope; proactively identifies and reduces technical debt."
      exceeds: "Introduces improvements to code quality, patterns, or tooling that are adopted by the broader team."
    - name: "System design & architecture"
      below: "Design decisions do not account for system-level constraints; relies on senior guidance for architectural choices."
      meets: "Designs components and services for features with sound trade-off reasoning; reviews and improves others' designs."
      exceeds: "Leads design of complex components; their architectural choices become team standards."
    - name: "Testing & quality mindset"
      below: "Test coverage for their feature scope is below team baseline; quality concerns are raised reactively."
      meets: "Owns testing for their feature scope end-to-end; advocates for quality in team discussions and design reviews."
      exceeds: "Improves team testing infrastructure; testing practices they introduce are adopted by peers."
    - name: "Collaboration & communication"
      below: "Technical concerns are not communicated effectively to product or cross-functional partners."
      meets: "Collaborates across teams; contributes to technical discussions; influences peers through clear reasoning."
      exceeds: "Drives technical alignment across teams; cross-functional partners proactively seek their input on design decisions."
    - name: "Mentorship & knowledge sharing"
      below: "Does not invest in growing junior engineers; code review feedback is minimal or unhelpful."
      meets: "Mentors junior and trainee engineers; conducts thorough code reviews; contributes to team knowledge through documentation."
      exceeds: "Runs knowledge-sharing initiatives (tech talks, guides, pair programming) that measurably accelerate team growth."
    - name: "Business & product impact"
      below: "Technical decisions are made without consideration of business or product implications."
      meets: "Connects technical decisions to product and user outcomes; participates in product planning as a technical voice."
      exceeds: "Technical proposals they champion measurably improve product quality, performance, or user experience."
  aggregation:
    exceeds: "Exceeds in at least three dimensions; recognized as a technical authority and mentor within their team."
    meets: "Independently owns feature-level technical delivery, mentors junior engineers, and contributes to cross-team design discussions."
    below: "Technical quality or collaboration is poor in two or more dimensions; significant senior oversight is required."
    meets_trending_below: "Delivering feature work reliably but not yet demonstrating the mentorship or cross-team influence expected at Mid level."

senior_dev:
  role: "Senior Developer"
  level: "Senior"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Code quality or technical debt reduction is limited to their own feature work; does not raise the team's bar."
      meets: "Sets the code quality bar; makes significant technical contributions; strategically reduces technical debt across the codebase."
      exceeds: "Technical contributions are cited by peers as references; patterns they introduce become team-wide or org-wide standards."
    - name: "System design & architecture"
      below: "Designs are scoped to a single service; does not consider multi-team or cross-system implications."
      meets: "Designs systems that serve multiple teams or subsystems; considers scalability, reliability, and security trade-offs rigorously."
      exceeds: "Architectural decisions they lead become long-term foundations for the product; they prevent entire classes of future problems."
    - name: "Testing & quality mindset"
      below: "Testing culture in their area has not improved; quality concerns reach production at above-baseline rates."
      meets: "Champions testing culture; builds testing infrastructure; influences org quality practices beyond their immediate team."
      exceeds: "Testing practices they introduce measurably reduce production incidents; other teams adopt their quality frameworks."
    - name: "Collaboration & communication"
      below: "Cross-team technical leadership is limited; product and stakeholder communication is not consistent."
      meets: "Cross-team technical leader; represents engineering to product and stakeholders; drives technical alignment across teams."
      exceeds: "Trusted technical voice at the organization level; their technical perspective shapes product strategy and roadmap."
    - name: "Mentorship & knowledge sharing"
      below: "Mentorship is limited to occasional feedback; does not systematically grow other engineers."
      meets: "Formally grows multiple engineers; creates standards and best practices; conducts structured technical interviews."
      exceeds: "Has produced mid and junior engineers who independently lead features; their mentorship is cited as career-defining by others."
    - name: "Business & product impact"
      below: "Technical decisions are not visibly connected to business outcomes."
      meets: "Drives technical decisions that directly impact business metrics (performance, reliability, feature velocity)."
      exceeds: "Technical investments they champion deliver measurable, leadership-visible improvements in business outcomes."
  aggregation:
    exceeds: "Exceeds in at least three dimensions with org-visible impact; peers cite them as a key reason for team success."
    meets: "Independently leads multi-team technical work, mentors multiple engineers, and connects technical decisions to business outcomes."
    below: "Design or collaboration is poor in two or more dimensions, or mentorship is entirely absent."
    meets_trending_below: "Delivering technically sound work but operating at feature-level scope without the cross-team influence expected at Senior."

staff_dev:
  role: "Staff Developer"
  level: "Staff"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Technical contributions are team-scoped; not yet establishing patterns adopted company-wide."
      meets: "Org-wide technical contributions; introduces patterns and practices adopted across multiple teams or the entire engineering org."
      exceeds: "Technical work becomes foundational infrastructure; other teams build on their foundations for years."
    - name: "System design & architecture"
      below: "Design authority is limited to a single domain; does not influence cross-org architectural decisions."
      meets: "Designs distributed systems and platforms; makes org-level architectural decisions that shape how multiple teams build."
      exceeds: "Architectural vision they define becomes the company's technical foundation; avoids entire classes of future scaling or reliability problems."
    - name: "Testing & quality mindset"
      below: "Quality strategy is team-level; does not define or influence org-wide testing practices."
      meets: "Defines quality strategy for the organization; introduces testing paradigms that raise the quality floor across all teams."
      exceeds: "Testing philosophy they champion measurably reduces org-wide production incidents; industry peers reference their approach."
    - name: "Collaboration & communication"
      below: "Technical authority is limited to department level; not yet a trusted voice in company-wide engineering decisions."
      meets: "Technical authority across the organization; shapes engineering culture and company-wide technical decisions."
      exceeds: "Engineering culture they champion is recognized externally; the company attracts talent because of the technical environment they helped create."
    - name: "Mentorship & knowledge sharing"
      below: "Mentorship is individual-focused; senior engineers in other teams do not grow as a result."
      meets: "Grows senior engineers across the org; builds engineering culture through org-wide practices, standards, and career development frameworks."
      exceeds: "Has produced multiple senior and staff-track engineers; mentorship programs they create outlast their direct involvement."
    - name: "Business & product impact"
      below: "Technical strategy is not connected to company business strategy or executive-level goals."
      meets: "Technical strategy directly shapes company business strategy; executive leadership relies on their technical judgment."
      exceeds: "Technical investments they lead are cited in company-level business outcomes (earnings, market position, fundraising)."
  aggregation:
    exceeds: "Exceeds in four or more dimensions with company-level, documented impact; regarded as a defining technical voice in the org."
    meets: "Drives org-wide technical strategy, grows senior engineers, and is a trusted advisor to engineering and product leadership."
    below: "Impact is department-scoped rather than org-scoped, or requires exec direction on problems that should be self-generated."
    meets_trending_below: "Delivering org-level technical work but not yet demonstrating the company-wide strategic influence expected at Staff."

principal_dev:
  role: "Principal Developer"
  level: "Principal"
  dimensions:
    - name: "Technical implementation & code quality"
      below: "Technical influence does not extend beyond the company; not viewed as an industry-level authority."
      meets: "Defines engineering practices adopted company-wide; recognized externally through publications, open-source leadership, or conference talks."
      exceeds: "Technical contributions are reference implementations in the broader industry; advances the state of the art in their domain."
    - name: "System design & architecture"
      below: "Architectural influence is company-scoped; does not shape how the industry approaches system design."
      meets: "Company-level or industry-level architectural influence; design decisions they make become reference architectures."
      exceeds: "Architectural thinking they champion defines how companies in the industry approach problems at scale."
    - name: "Testing & quality mindset"
      below: "Quality thought leadership is company-internal; does not engage with or shape industry quality practices."
      meets: "Defines industry practices; a recognized thought leader in engineering quality; external peers reference their work."
      exceeds: "Quality frameworks or tools they create become industry standards; they are sought out to advise organizations outside their own."
    - name: "Collaboration & communication"
      below: "External influence is limited; does not shape how the company is perceived technically in the industry."
      meets: "External influence through conference leadership, open-source contributions, or standards bodies; company's technical reputation benefits."
      exceeds: "Widely regarded as a defining technical voice in the industry; their external work measurably attracts talent and partners to the company."
    - name: "Mentorship & knowledge sharing"
      below: "Mentorship is individual-focused; does not build a self-sustaining pipeline of technical leadership."
      meets: "Grows principal-track and staff engineers; creates mentorship structures and career frameworks that scale across the org."
      exceeds: "Has produced multiple staff and principal engineers who independently lead at scale; mentorship legacy is measurable and lasting."
    - name: "Business & product impact"
      below: "Technical work is not connected to company-level business strategy or competitive positioning."
      meets: "Co-creates business strategy from a technical perspective; executive and board-level decisions are informed by their technical input."
      exceeds: "Technical bets they champion become company-level competitive advantages recognized in the market."
  aggregation:
    exceeds: "Exceeds in four or more dimensions with verifiable industry-level impact; company's technical reputation is measurably shaped by their work."
    meets: "Co-creates company technical strategy, develops the next generation of principal engineers, and is a trusted external voice for the company."
    below: "Impact is org-scoped rather than company or industry-scoped; direction requires exec input rather than being self-generated."
    meets_trending_below: "Meeting company-level expectations but not yet demonstrating the external influence or industry-shaping vision expected at Principal."
