{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center py-8">
  <div class="w-full max-w-sm bg-white border border-slate-200 rounded-2xl px-6 py-8 shadow-sm">
    <h1 class="text-xl font-medium mb-6 text-center">Create account</h1>
    {% if error %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">{{ error }}</p>
    {% endif %}
    <form action="/register" method="post" class="space-y-3">
      <input name="email" type="email" placeholder="name@company.com" required
             class="w-full border border-slate-300 rounded-lg px-3 py-3 text-base">
      <input name="password" type="password" placeholder="Password" required
             class="w-full border border-slate-300 rounded-lg px-3 py-3 text-base">
      <button class="w-full bg-slate-900 text-white rounded-lg px-4 py-3 text-base font-medium">Register</button>
    </form>
    <p class="text-sm text-slate-600 mt-4 text-center">Have an account? <a href="/login" class="underline">Log in</a></p>
  </div>
</div>
{% endblock %}
