<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Performance Assistant{% endblock %}</title>
  <link rel="stylesheet" href="/static/tailwind.css">
  <style>[x-cloak]{display:none}</style>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <nav class="border-b border-slate-200 bg-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
      {% if request.session.get('user_id') %}
      <a href="/" class="font-medium">Performance Assistant</a>
      <a href="/" class="text-slate-600 hover:text-slate-900">Assess</a>
      <a href="/history" class="text-slate-600 hover:text-slate-900">History</a>
      <a href="/profile" class="text-slate-600 hover:text-slate-900">Profile</a>
      <form action="/logout" method="post" class="ml-auto">
        <button class="text-slate-500 hover:text-slate-900">Log out</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
