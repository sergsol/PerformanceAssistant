# CI for PerfReviewBot — runs the full test pyramid on every push/PR.
# Evals run on a weekly schedule + manual trigger (they cost tokens).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Weekly eval run (Monday 06:00 UTC) — rate-limited, costs tokens
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format (check only)
        run: ruff format --check app/ tests/

  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Unit + API tests (stubbed LLM)
        env:
          LLM_PROVIDER: stub
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-ci
        run: |
          pytest tests/unit tests/api -v --tb=short --no-header

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit-api
          path: .pytest_cache/
          retention-days: 7

  ui:
    runs-on: ubuntu-latest
    needs: [unit-and-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install system deps for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start the app (stubbed LLM)
        env:
          LLM_PROVIDER: stub
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-ci
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          APP_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/docs > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "Server PID: $APP_PID"

      - name: Run UI tests
        env:
          BASE_URL: http://localhost:8000
        run: |
          pytest tests/ui -v --tb=short --no-header -m ui

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  evals:
    runs-on: ubuntu-latest
    needs: [unit-and-api]
    # Only run evals on schedule or manual dispatch, not on every PR (cost + rate limits)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run evals
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-ci
        run: |
          pytest tests/evals -v --tb=short --no-header -m evals
        # Evals are expected to be slow; give them time
        timeout-minutes: 30
